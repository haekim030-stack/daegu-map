<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F4">
<title>大邱おでかけマップ</title>
<style>
/* =============================================================
 * 디자인 토큰 — 색·글자·간격·모서리·그림자는 전부 여기서만 정의
 * ============================================================= */
:root {
  /* 색: 따뜻한 종이색 바탕 + 먹색 글자 + 포인트(찜) 1색. 구역 색은 areas.json */
  --bg:        #FBF8F4;
  --surface:   #FFFFFF;
  --surface-2: #F4EFE8;
  --line:      #E8E1D7;
  --ink:       #26221E;
  --ink-2:     #5E574F;
  --ink-3:     #948B80;
  --heart:     #E5484D;
  --heart-soft:#FDECEC;
  --naver:     #03C75A;

  /* 일러스트 지도 */
  --sea:        #EDE5D8;
  --sea-2:      #E4DACB;
  --land:       #FFFDF9;
  --land-edge:  #EADFD0;
  --land-shadow:#D8CBB8;
  --land-label: #B4A794;

  /* 글자 크기 */
  --fs-xs: 11px; --fs-s: 12px; --fs-m: 13.5px; --fs-base: 15px; --fs-l: 17px; --fs-xl: 20px; --fs-2xl: 24px;
  /* 간격 (4px 단위) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px;
  /* 모서리 */
  --r-s: 8px; --r-m: 12px; --r-l: 20px; --r-pill: 999px;
  /* 그림자 2단계 */
  --e1: 0 1px 2px rgba(38,34,30,.06), 0 2px 6px rgba(38,34,30,.05);
  --e2: 0 10px 30px rgba(38,34,30,.14);
  /* 움직임 */
  --ease: cubic-bezier(.2,.8,.2,1);
  --t: 220ms;

  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN",
          "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", "Malgun Gothic", Meiryo, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: var(--fs-base); line-height: 1.5; -webkit-font-smoothing: antialiased; }
html, body { overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; display: block; }
.ic-s { width: 16px; height: 16px; }

/* 앱 전체를 화면에 고정 — 페이지 자체는 절대 스크롤되지 않음 (iOS 사파리 대응) */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- 상단 ---------- */
.topbar { display: flex; align-items: center; gap: var(--s2);
  padding: calc(var(--s2) + env(safe-area-inset-top)) var(--s4) var(--s2); background: var(--bg); z-index: 5; }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font-size: var(--fs-l); font-weight: 800; letter-spacing: -.01em; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand p { margin: 0; font-size: var(--fs-s); color: var(--ink-3); }

.icon-btn { width: 40px; height: 40px; border-radius: var(--r-pill); display: inline-flex; align-items: center;
  justify-content: center; background: var(--surface); box-shadow: var(--e1); flex: none; }
.fav-btn { width: auto; min-width: 40px; padding: 0 var(--s3); gap: 6px; color: var(--heart);
  font-weight: 700; font-size: var(--fs-m); }
.fav-btn .ic { fill: currentColor; stroke: none; width: 18px; height: 18px; }
.fav-btn.bump { animation: bump .35s var(--ease); }
@keyframes bump { 50% { transform: scale(1.15); } }

.seg { display: inline-flex; padding: 3px; border-radius: var(--r-pill); background: var(--surface-2); flex: none; }
.seg button { height: 34px; padding: 0 var(--s3); border-radius: var(--r-pill); font-size: var(--fs-s); font-weight: 600; color: var(--ink-3);
  transition: background var(--t) var(--ease), color var(--t) var(--ease); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--e1); }

.tip { display: flex; align-items: center; gap: var(--s2); margin: 0 var(--s4) var(--s2); padding: var(--s2) var(--s1) var(--s2) var(--s3);
  background: var(--surface); border-radius: var(--r-m); box-shadow: var(--e1); font-size: var(--fs-s); color: var(--ink-2); line-height: 1.45; }
.tip > .ic { color: var(--naver); }
.tip p { margin: 0; flex: 1; }
.tip button { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); border-radius: var(--r-pill); flex: none; }
.tip button .ic { width: 16px; height: 16px; }

/* 칩: 구역 선택·카테고리 필터 공통 컴포넌트 */
.chips { display: flex; gap: var(--s2); overflow-x: auto; padding: var(--s1) var(--s4) var(--s3); scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--s3);
  border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  font-size: var(--fs-m); font-weight: 600; color: var(--ink-2); white-space: nowrap;
  transition: background var(--t) var(--ease), color var(--t) var(--ease), box-shadow var(--t) var(--ease); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); }
.chip .n { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }
.chip.on { background: var(--ink); color: #fff; box-shadow: none; }
.chip.on .dot { box-shadow: 0 0 0 2px #fff; }
.chip.on .n { color: rgba(255,255,255,.7); }

/* ---------- 지도 ---------- */
.map-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; overflow: hidden; isolation: isolate; border-radius: var(--r-l) var(--r-l) 0 0;
  background: radial-gradient(120% 90% at 50% 35%, var(--sea), var(--sea-2));
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#map:active { cursor: grabbing; }
#mapSvg, #leaders { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#leaders { pointer-events: none; }
#areaLabels, #pins { position: absolute; inset: 0; pointer-events: none; }
#pins { z-index: 2; }
.shadow path { fill: var(--land-shadow); stroke: var(--land-shadow); stroke-width: 4; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.land path { fill: var(--land); stroke: var(--land); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.lines path { fill: none; stroke: var(--land-edge); stroke-width: 1.2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.dlabels text { fill: var(--land-label); font-weight: 700; font-family: var(--font); letter-spacing: .04em;
  transition: opacity var(--t) var(--ease); pointer-events: none; }
#map.zoomed .dlabels text { opacity: 0; }
.leader { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; transition: opacity var(--t); }
.leader.sel { opacity: 0; }

.area-label { position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform;
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 var(--s3) 0 10px;
  background: var(--surface); border-radius: var(--r-pill); box-shadow: var(--e1), 0 0 0 1px rgba(38,34,30,.04);
  white-space: nowrap; transition: opacity var(--t) var(--ease); }
.area-label .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.area-label b { font-size: var(--fs-m); font-weight: 700; }
.area-label small { font-size: var(--fs-xs); color: var(--ink-3); }
#map.zoomed .area-label { opacity: .92; }
#map.zoomed .area-label.sel, .area-label.nofit { opacity: 0 !important; pointer-events: none; }
#map.zoomed .area-label small { display: none; }
.leader.nofit { opacity: 0; }

.area-pin { position: absolute; left: 0; top: 0; width: 32px; height: 40px; pointer-events: auto; will-change: transform;
  overflow: visible; transition: opacity var(--t) var(--ease); }
.area-pin .pin-in { display: block; width: 32px; height: 40px; transform-origin: 50% 100%;
  transition: transform var(--t) var(--ease); filter: drop-shadow(0 3px 4px rgba(38,34,30,.28)); }
.area-pin svg { display: block; overflow: visible; }
.area-pin.sel .pin-in { transform: scale(1.3); animation: drop .5s var(--ease); }
.area-pin.dim { opacity: .4; }
@keyframes drop { 0% { translate: 0 -14px; } 60% { translate: 0 2px; } 100% { translate: 0 0; } }
.fav-dot { position: absolute; left: 22px; top: -8px; display: inline-flex; align-items: center; gap: 2px;
  height: 18px; padding: 0 6px; border-radius: var(--r-pill); background: var(--heart); color: #fff;
  font-size: var(--fs-xs); font-weight: 700; box-shadow: 0 0 0 2px var(--surface); }
.fav-dot .ic { width: 10px; height: 10px; fill: currentColor; stroke: none; }

.hint { position: absolute; left: 50%; bottom: calc(var(--s4) + env(safe-area-inset-bottom)); transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: var(--s2); padding: 10px var(--s4); border-radius: var(--r-pill);
  background: var(--surface); box-shadow: var(--e2); color: var(--ink-2); font-size: var(--fs-m); font-weight: 600;
  white-space: nowrap; z-index: 500; pointer-events: none; }
.hint .ic { width: 18px; height: 18px; color: var(--ink-3); }

/* ---------- 바텀시트 ---------- */
.sheet { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 850;
  display: flex; flex-direction: column; background: var(--bg); border-radius: var(--r-l) var(--r-l) 0 0; box-shadow: var(--e2);
  transform: translateY(105%); transition: transform 320ms var(--ease), visibility 0s; will-change: transform; }
.sheet:not(.open) { visibility: hidden; transition: transform 320ms var(--ease), visibility 0s 320ms; }
/* 시트가 끝까지 올라가기 전에는 목록 대신 시트 자체가 움직임 (네이버지도 방식) */
.sheet:not(.full) .sheet-list { overflow: hidden; }
.sheet.full { border-radius: 0; }
/* 목록을 끝까지 올리면 안내문·구역 칩도 접어서 목록 공간을 최대로 */
#app.sheet-full .tip, #app.sheet-full #areaChips { display: none; }
.sheet-handle, .sheet-head, .sheet .chips { flex: none; }
.sheet-handle { width: 100%; padding: 10px 0 6px; touch-action: none; }
.sheet-handle::before { content: ""; display: block; width: 36px; height: 4px; margin: 0 auto; border-radius: 2px; background: var(--line); }
.sheet-head { padding: var(--s1) var(--s4) var(--s3); }
.back-btn { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 var(--s3) 0 6px; margin-left: -6px;
  border-radius: var(--r-pill); font-size: var(--fs-m); font-weight: 600; color: var(--ink-2); }
.back-btn .ic { width: 18px; height: 18px; }
.back-btn:active { background: var(--surface-2); }
.sheet-title { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); }
.sheet-title .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
.sheet-title h2 { margin: 0; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
.sheet-title .sub { font-size: var(--fs-m); color: var(--ink-3); }
.sheet-desc { margin: var(--s1) 0 0; font-size: var(--fs-m); color: var(--ink-2); line-height: 1.6; }
.sheet .chips { padding: 0 var(--s4) var(--s3); }
.sheet .chip { height: 32px; font-size: var(--fs-s); padding: 0 var(--s3) 0 10px; }
.sheet-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.empty { text-align: center; color: var(--ink-3); padding: var(--s6) var(--s2); font-size: var(--fs-m); white-space: pre-line; line-height: 1.7; }

/* ---------- 장소 카드 ---------- */
.card { display: flex; gap: var(--s3); align-items: stretch; padding: var(--s3); margin-bottom: var(--s2);
  background: var(--surface); border-radius: var(--r-m); box-shadow: var(--e1); cursor: pointer;
  transition: transform 120ms var(--ease); }
.card:active { transform: scale(.985); }
.thumb { flex: none; width: 76px; height: 76px; border-radius: var(--r-s); overflow: hidden; background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--ink-3); }
.ph .ic { width: 28px; height: 28px; stroke-width: 1.5; }
.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card-name { font-size: var(--fs-base); font-weight: 700; line-height: 1.35; }
.card-sub { font-size: var(--fs-s); color: var(--ink-3); margin-top: 1px; }
.card-desc { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.5; margin-top: var(--s1);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; align-items: center; gap: var(--s1); margin-top: auto; padding-top: 6px;
  font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); }
.meta .ic { width: 14px; height: 14px; }
.heart-btn { flex: none; align-self: flex-start; width: 40px; height: 40px; margin: -6px -6px 0 0; border-radius: var(--r-pill);
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink-3); }
.heart-btn .ic { width: 22px; height: 22px; }
.heart-btn.on { color: var(--heart); }
.heart-btn.on .ic { fill: currentColor; }

/* ---------- 전체 화면 (상세·찜 목록) ---------- */
.modal { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; flex-direction: column;
  animation: rise 260ms var(--ease); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.modal-bar { display: flex; align-items: center; gap: var(--s3); min-height: 56px;
  padding: calc(var(--s2) + env(safe-area-inset-top)) var(--s4) var(--s2); background: var(--bg); }
.modal-bar .title { flex: 1; min-width: 0; font-size: var(--fs-l); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

.gallery { position: relative; margin: 0 var(--s4); border-radius: var(--r-l); overflow: hidden; background: var(--surface-2); }
.slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 3; }
.slider::-webkit-scrollbar { display: none; }
.slider img, .slider .ph { flex: none; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: center; display: block; }
.slider .ph { display: flex; }
.slider .ph .ic { width: 48px; height: 48px; }
.dots { position: absolute; left: 0; right: 0; bottom: var(--s3); display: flex; justify-content: center; gap: 6px; pointer-events: none; }
.dots i { width: 6px; height: 6px; border-radius: var(--r-pill); background: rgba(255,255,255,.6); box-shadow: 0 0 2px rgba(0,0,0,.3);
  transition: width var(--t) var(--ease), background var(--t); }
.dots i.on { width: 18px; background: #fff; }

.detail { padding: var(--s5) var(--s4) var(--s6); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: var(--fs-s); font-weight: 600; color: var(--ink-2); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pill .ic { width: 14px; height: 14px; }
.detail h2 { margin: var(--s3) 0 0; font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.015em; line-height: 1.3; }
.detail .sub { font-size: var(--fs-m); color: var(--ink-3); margin-top: 2px; }
.detail .lead { margin: var(--s4) 0 0; font-size: var(--fs-base); line-height: 1.75; color: var(--ink-2); white-space: pre-line; }
.info { margin-top: var(--s4); background: var(--surface); border-radius: var(--r-m); box-shadow: var(--e1); }
.info-row { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); font-size: var(--fs-m); line-height: 1.55; color: var(--ink-2); white-space: pre-line; }
.info-row + .info-row { border-top: 1px solid var(--line); }
.info-row .ic { color: var(--ink-3); width: 18px; height: 18px; margin-top: 1px; }
.section-h { display: flex; align-items: baseline; gap: var(--s2); margin: var(--s6) 0 0; }
.section-h h3 { margin: 0; font-size: var(--fs-l); font-weight: 800; }
.section-h span { font-size: var(--fs-s); color: var(--ink-3); }
.menu-sec { margin: var(--s4) 0 var(--s2); font-size: var(--fs-s); font-weight: 700; color: var(--ink-3); letter-spacing: .04em; }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.menu-item { background: var(--surface); border-radius: var(--r-m); overflow: hidden; box-shadow: var(--e1); display: flex; flex-direction: column; }
.menu-photo { position: relative; display: block; width: 100%; aspect-ratio: 1; background: var(--surface-2); }
.menu-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { position: absolute; left: var(--s2); top: var(--s2); height: 22px; padding: 0 8px; display: inline-flex; align-items: center;
  border-radius: var(--r-pill); background: var(--ink); color: #fff; font-size: var(--fs-xs); font-weight: 700; }
.menu-info { padding: 10px var(--s3) var(--s3); display: flex; flex-direction: column; flex: 1; }
.menu-name { font-size: var(--fs-m); font-weight: 700; line-height: 1.4; }
.menu-sub { font-size: var(--fs-xs); color: var(--ink-3); margin-top: 1px; }
.menu-desc { font-size: var(--fs-s); color: var(--ink-2); line-height: 1.5; margin-top: 6px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.price { margin-top: auto; padding-top: var(--s2); font-size: var(--fs-m); font-weight: 800; }
.menu-list { background: var(--surface); border-radius: var(--r-m); box-shadow: var(--e1); }
.menu-row { display: flex; gap: var(--s3); align-items: baseline; padding: var(--s3) var(--s4); }
.menu-row + .menu-row { border-top: 1px solid var(--line); }
.menu-row .menu-text { flex: 1; min-width: 0; }
.menu-row .menu-desc { -webkit-line-clamp: unset; }
.menu-row .price { margin: 0; padding: 0; white-space: nowrap; }
.menu-grid + .menu-list { margin-top: var(--s3); }

.actions { display: grid; grid-template-columns: auto 1fr 1fr; gap: var(--s2);
  padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom)); background: var(--bg); box-shadow: 0 -1px 0 var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 48px; padding: 0 var(--s4);
  border-radius: var(--r-m); font-size: var(--fs-m); font-weight: 700; text-decoration: none; white-space: nowrap;
  transition: transform 120ms var(--ease), background var(--t), color var(--t); }
.btn:active { transform: scale(.97); }
.btn .ic { width: 18px; height: 18px; }
.btn-outline { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.btn-outline .ic { width: 14px; height: 14px; color: var(--ink-3); }
.btn-naver { background: var(--naver); color: #fff; }
.btn-dark { background: var(--ink); color: #fff; width: 100%; }
.btn-dark:disabled { opacity: .3; }
.btn-fav { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--heart); padding: 0 var(--s3); }
.btn-fav.on { background: var(--heart-soft); box-shadow: inset 0 0 0 1px var(--heart); }
.btn-fav.on .ic { fill: currentColor; }

.favs-wrap { padding: 0 var(--s4) var(--s6); }
.favs-lead { margin: 0; font-size: var(--fs-m); color: var(--ink-2); }
.fav-group h3 { display: flex; align-items: center; gap: var(--s2); margin: var(--s5) 0 var(--s2); font-size: var(--fs-base); font-weight: 800; }
.fav-group h3 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.preview-label { margin: var(--s6) 0 var(--s2); font-size: var(--fs-s); font-weight: 700; color: var(--ink-3); }
.preview { display: block; width: 100%; resize: none; border: 0; border-radius: var(--r-m); padding: var(--s3) var(--s4);
  background: var(--surface-2); color: var(--ink-2); font: var(--fs-s)/1.7 var(--font); }
.foot { padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom)); box-shadow: 0 -1px 0 var(--line); background: var(--bg); }

.lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(20,18,16,.94); display: flex; align-items: center; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lightbox .icon-btn { position: absolute; top: calc(var(--s3) + env(safe-area-inset-top)); right: var(--s3); background: rgba(255,255,255,.14); color: #fff; box-shadow: none; }

.update-bar { position: fixed; left: 50%; top: calc(var(--s3) + env(safe-area-inset-top)); z-index: 2500;
  transform: translate(-50%, -140%); transition: transform 320ms var(--ease);
  display: flex; align-items: center; gap: var(--s3); width: max-content; max-width: calc(100% - 24px);
  padding: var(--s2) var(--s2) var(--s2) var(--s4); border-radius: var(--r-pill); background: var(--ink); color: #fff;
  box-shadow: var(--e2); font-size: var(--fs-m); font-weight: 600; }
.update-bar.show { transform: translate(-50%, 0); }

.update-bar button.go { height: 34px; padding: 0 var(--s3); border-radius: var(--r-pill); background: #fff; color: var(--ink); font-size: var(--fs-s); font-weight: 700; white-space: nowrap; }
.update-bar button.x { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7); }

  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; width: max-content; max-width: calc(100% - 32px);
  padding: var(--s3) var(--s4); border-radius: var(--r-m); background: var(--ink); color: #fff; box-shadow: var(--e2);
  font-size: var(--fs-m); line-height: 1.5; text-align: center; white-space: pre-line; transition: opacity var(--t), transform var(--t) var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.load-error { position: absolute; inset: 0; z-index: 950; display: flex; align-items: center; justify-content: center;
  padding: var(--s6); background: var(--bg); text-align: center; font-size: var(--fs-m); line-height: 1.7; color: var(--ink-2); }
.load-error code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }

@media (min-width: 720px) {
  .sheet { left: var(--s4); right: auto; top: var(--s4); bottom: var(--s4); width: 400px; border-radius: var(--r-l); }
  .sheet .sheet-list { overflow-y: auto !important; }
  .sheet-handle { display: none; }
  .modal { left: 50%; width: 480px; transform: translateX(-50%); box-shadow: var(--e2); }

  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p data-i18n="sub"></p>
    </div>
    <button class="icon-btn fav-btn" id="favBadge" type="button" aria-label="favorites"><span data-icon="heart"></span><span id="favCount">0</span></button>
    <div class="seg" role="group" aria-label="language">
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="ko">한국어</button>
    </div>
  </header>

  <div class="tip" id="notice">
    <span data-icon="nav"></span>
    <p data-i18n="notice"></p>
    <button type="button" id="noticeClose" aria-label="close"><span data-icon="close"></span></button>
  </div>

  <nav class="chips" id="areaChips"></nav>

  <div class="map-wrap">
    <div id="map">
      <svg id="mapSvg" aria-hidden="true"></svg>
      <svg id="leaders" aria-hidden="true"></svg>
      <div id="areaLabels"></div>
      <div id="pins"></div>
    </div>
    <div class="hint" id="hint"><span data-icon="tap"></span><span data-i18n="hint"></span></div>

    <section class="sheet" id="sheet" aria-hidden="true">
      <button class="sheet-handle" id="sheetHandle" type="button" aria-label="toggle"></button>
      <div class="sheet-head">
        <button class="back-btn" type="button" id="backBtn"><span data-icon="back"></span><span data-i18n="back"></span></button>
        <div class="sheet-title" id="sheetTitle">
          <span class="dot"></span>
          <h2 id="sheetName"></h2>
          <span class="sub" id="sheetSub"></span>
        </div>
        <p class="sheet-desc" id="sheetDesc"></p>
      </div>
      <div class="chips" id="filters"></div>
      <div class="sheet-list" id="sheetList"></div>
    </section>
  </div>
</div>

<!-- 장소 상세 -->
<div class="modal" id="detail" role="dialog" aria-modal="true" hidden>
  <div class="modal-bar">
    <button class="icon-btn" type="button" data-close aria-label="back"><span data-icon="back"></span></button>
    <div class="title" id="detailTitle"></div>
  </div>
  <div class="modal-body" id="detailBody"></div>
  <div class="actions" id="detailActions"></div>
</div>

<!-- 찜 목록 -->
<div class="modal" id="favs" role="dialog" aria-modal="true" hidden>
  <div class="modal-bar">
    <button class="icon-btn" type="button" data-close aria-label="back"><span data-icon="back"></span></button>
    <div class="title" data-i18n="fav_title"></div>
  </div>
  <div class="modal-body"><div class="favs-wrap" id="favList"></div></div>
  <div class="foot">
    <button class="btn btn-dark" type="button" id="copyBtn"><span data-icon="copy"></span><span data-i18n="copy"></span></button>
  </div>
</div>

<!-- 사진 크게 보기 -->
<div class="lightbox" id="lightbox" hidden>
  <img id="lightboxImg" alt="">
  <button class="icon-btn" type="button" data-close aria-label="close"><span data-icon="close"></span></button>
</div>

<div class="update-bar" id="updateBar" role="status" aria-live="polite">
  <span data-icon="spark"></span><span id="updateMsg"></span>
  <button class="go" type="button" id="updateGo" data-i18n="update_btn"></button>
  <button class="x" type="button" id="updateClose" aria-label="close"><span data-icon="close"></span></button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =========================================================
   * UI 문구 (일본어 / 한국어)
   * ========================================================= */
  const STR = {
    ja: {
      title: '大邱おでかけマップ',

      back: '全体マップ',

      empty_cat: 'このカテゴリの場所はまだありません',
      other: 'その他',
      price: v => `${v}ウォン`,

      update_new: n => `新しい場所が${n}件追加されました`,
      update_changed: '内容が更新されました',
      update_btn: '更新する',
    },
    ko: {
      title: '대구 둘러보기 지도',
      sub: '11월 16일 · 대구 나들이',
      notice: '한국에서는 구글맵 길찾기가 잘 안 되니 네이버지도 앱을 추천합니다.',
      hint: '핀을 누르거나, 지도를 움직여 보세요',
      all: '전체 지도',
      back: '전체 지도',
      cat_all: '전체', cat_restaurant: '식당', cat_cafe: '카페', cat_activity: '액티비티', cat_shop: '쇼핑',
      menu: '메뉴',
      menu_note: '가격은 바뀔 수 있어요',
      signature: '대표',
      fav_off: '가고 싶어요',
      fav_on: '가고 싶어요!',
      naver: '네이버지도',
      google: 'Google Maps',
      fav_title: '찜 목록',
      fav_lead: '가고 싶은 곳을 다 골랐으면 복사해서 보내 주세요.',
      fav_empty: '아직 없어요.\n가고 싶은 곳의 ♡ 를 눌러 주세요',
      preview: '보낼 내용',
      copy: '찜 목록 복사',
      copied: '복사했어요!\nLINE이나 카톡으로 보내주세요',
      copy_fail: '복사가 안 됐어요.\n"보낼 내용"을 길게 눌러 복사해 주세요',
      empty_cat: '이 카테고리엔 아직 장소가 없어요',
      other: '기타',
      price: v => `${v}원`,
      load_err: '데이터를 불러오지 못했어요.',
      update_new: n => `새 장소가 ${n}곳 추가됐어요`,
      update_changed: '내용이 업데이트됐어요',
      update_btn: '새로고침',
    },
  };

  /* =========================================================
   * 아이콘 (24px 격자, 선 굵기 통일)
   * ========================================================= */
  const ICON = {
    heart: '<path d="M12 20.3s-7.5-4.6-7.5-10.3A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    food: '<path d="M7 3v7m-2.5-7v4.5a2.5 2.5 0 0 0 5 0V3M7 10v11M17.5 21V3c-2.2 1.2-3.5 3.6-3.5 7v3h3.5"/>',
    cafe: '<path d="M4 9h12v4.5A5.5 5.5 0 0 1 10.5 19h-1A5.5 5.5 0 0 1 4 13.5V9zM16 10.5h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5c-.7.8-.7 1.7 0 2.5M12 3.5c-.7.8-.7 1.7 0 2.5"/>',
    play: '<path d="M12 3.5l2.4 5.1 5.6.7-4.1 3.9 1 5.5L12 16.1l-4.9 2.6 1-5.5-4.1-3.9 5.6-.7z"/>',
    bag: '<path d="M5 8.5h14l-1.1 11.5H6.1L5 8.5z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/>',
    spark: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
    grid: '<path d="M4.5 4.5h6v6h-6zM13.5 4.5h6v6h-6zM4.5 13.5h6v6h-6zM13.5 13.5h6v6h-6z"/>',
    map: '<path d="M9 4.5L4 6.5v13l5-2 6 2 5-2v-13l-5 2-6-2zM9 4.5v13M15 6.5v13"/>',
    pin: '<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>',
    nav: '<path d="M20 4L4 10.5l7 2.5 2.5 7z"/>',
    tap: '<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.6a5 5 0 0 1-3.9-1.9L4.6 16a1.6 1.6 0 0 1 2.4-2.1L9 15.5"/>',
    out: '<path d="M14 4.5h5.5V10M19.5 4.5L11 13M17 14v4a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 5 18V9a1.5 1.5 0 0 1 1.5-1.5h4"/>',
  };
  const ic = (name, cls) => `<svg class="ic ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ''}</svg>`;

  const CATS = { restaurant: 'food', cafe: 'cafe', activity: 'play', shop: 'bag' };
  const CAT_KEYS = ['all', 'restaurant', 'cafe', 'activity', 'shop'];
  const AREA_COLORS = ['#E07A2E', '#3E63B8', '#2E8C7E', '#C9971E', '#8A55A6', '#5F8A3A'];

  /* =========================================================
   * localStorage (실패해도 앱은 동작)
   * ========================================================= */
  const store = {
    get(key, def) {
      try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); }
      catch (e) { return def; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 저장 불가 환경 */ }
    },
  };

  /* =========================================================
   * 상태 / 도우미
   * ========================================================= */
  let lang = store.get('daegu-map:lang', 'ja');
  if (!STR[lang]) lang = 'ja';
  const favs = new Set((store.get('daegu-map:favs', []) || []).filter(x => typeof x === 'string'));
  const S = { areas: [], places: [], areaById: {}, placeById: {}, currentArea: null, filter: 'all', detailId: null };

  const $ = sel => document.querySelector(sel);
  const t = key => STR[lang][key];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /** 이름: 현재 언어가 메인, 한국어 원문(또는 일본어)은 서브로 항상 같이 */
  function names(o) {
    const ko = (o.name_ko || '').trim();
    const ja = (o.name_ja || '').trim() || ko;
    if (lang === 'ja') return { main: ja, sub: ko && ko !== ja ? ko : '' };
    return { main: ko || ja, sub: ja && ja !== ko ? ja : '' };
  }
  /** 일반 텍스트 필드: 현재 언어 → 없으면 다른 언어 */
  function txt(o, field) {
    return String(o[`${field}_${lang}`] || o[`${field}_${lang === 'ja' ? 'ko' : 'ja'}`] || '').trim();
  }
  const catKey = p => (CATS[p.category] ? p.category : 'activity');
  const catLabel = key => t('cat_' + key) || key;
  function toNum(v) {
    if (v === null || v === undefined || v === '') return NaN;
    return typeof v === 'number' ? v : Number(v);
  }
  function validCoords(lat, lng) {
    const a = toNum(lat), b = toNum(lng);
    return Number.isFinite(a) && Number.isFinite(b) && Math.abs(a) <= 90 && Math.abs(b) <= 180;
  }
  function formatPrice(v) {
    if (v === null || v === undefined || v === '') return '';
    const n = toNum(v);
    if (Number.isFinite(n)) return t('price')(n.toLocaleString('ja-JP'));
    const from = String(v).match(/^\s*([\d,]+)\s*~\s*$/);              // "40,000~" → 40,000ウォン〜
    if (from) return t('price')(toNum(from[1].replace(/,/g, '')).toLocaleString('ja-JP')) + '〜';
    return String(v);
  }
  const placeholder = cat => `<div class="ph">${ic(CATS[cat] || 'play')}</div>`;
  const imgTag = (src, cat, alt) =>
    `<img src="${esc(src)}" alt="${esc(alt || '')}" loading="lazy" decoding="async" data-ph="${esc(cat)}">`;
  function fillIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = ic(el.dataset.icon); });
  }

  /* 이미지가 깨지면 카테고리 아이콘으로 교체 */
  document.addEventListener('error', e => {
    const img = e.target;
    if (img && img.tagName === 'IMG' && img.dataset.ph) {
      const tmp = document.createElement('div');
      tmp.innerHTML = placeholder(img.dataset.ph);
      img.replaceWith(tmp.firstChild);
    }
  }, true);

  /* =========================================================
   * 뒤로가기(폰 뒤로 버튼) 지원: 열린 화면을 스택으로 관리
   * ========================================================= */
  const layers = [];
  function pushLayer(name, close) {
    layers.push({ name, close });
    try { history.pushState({ depth: layers.length }, ''); } catch (e) {}
  }
  function closeTop() {
    if (!layers.length) return;
    try { history.back(); } catch (e) { const l = layers.pop(); if (l) l.close(); }
  }
  window.addEventListener('popstate', () => { const l = layers.pop(); if (l) l.close(); });

  /* =========================================================
   * 지도 (대구만 오려낸 일러스트 — 구역마다 핀 하나, 누르면 그 구역으로 부드럽게 확대)
   * ========================================================= */
  const NS = 'http://www.w3.org/2000/svg';
  const PIN_W = 32, PIN_H = 40, PIN_TIP_Y = 38;  // 핀 크기, 핀 끝(꽂히는 점)의 y
  const mapEl = $('#map'), mapSvg = $('#mapSvg'), leadersSvg = $('#leaders');
  const labelsEl = $('#areaLabels'), pinsEl = $('#pins');
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  let SHAPE = null;                             // daegu-shape.json
  let W = 0, H = 0;                             // 지도 영역 크기(px)
  const V = { x: 0, y: 0, w: 1, h: 1 };         // 지금 보이는 영역(SVG 좌표)
  const areaEls = {};                           // id -> { pin, label, leader, ax, ay, off }
  let shadowG, districtTexts = [], animId = 0;

  function svgEl(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    Object.entries(attrs || {}).forEach(([k, v]) => e.setAttribute(k, v));
    if (parent) parent.appendChild(e);
    return e;
  }
  function project(lat, lng) {                  // 위도·경도 -> SVG 좌표
    const P = SHAPE.projection;
    return [(lng - P.lon0) * P.cos * P.k, (P.lat0 - lat) * P.k];
  }
  const metersToUnits = m => m / (111320 / SHAPE.projection.k);
  const toPx = (x, y, v) => { v = v || V; return [(x - v.x) / v.w * W, (y - v.y) / v.h * H]; };
  function measure() { W = mapEl.clientWidth; H = mapEl.clientHeight; }

  function buildMap() {
    shadowG = svgEl('g', { class: 'shadow' }, mapSvg);
    const land = svgEl('g', { class: 'land' }, mapSvg);
    const lines = svgEl('g', { class: 'lines' }, mapSvg);
    const dl = svgEl('g', { class: 'dlabels' }, mapSvg);
    SHAPE.districts.forEach(d => {
      svgEl('path', { d: d.d }, shadowG);
      svgEl('path', { d: d.d }, land);
      svgEl('path', { d: d.d }, lines);
      const tx = svgEl('text', { x: d.label[0], y: d.label[1], 'text-anchor': 'middle', 'dominant-baseline': 'central' }, dl);
      districtTexts.push([tx, d]);
    });
    renderDistrictNames();
  }
  function renderDistrictNames() {
    districtTexts.forEach(([tx, d]) => { tx.textContent = lang === 'ja' ? d.name_ja : d.name_ko; });
  }

  function areaLabelHTML(a) {
    const n = names(a);
    return `<span class="dot"></span><b>${esc(n.main)}</b>${n.sub ? `<small>${esc(n.sub)}</small>` : ''}`;
  }
  const PIN_SVG = `<svg viewBox="0 0 ${PIN_W} ${PIN_H}" width="${PIN_W}" height="${PIN_H}" aria-hidden="true">
    <path d="M16 38C9 30 2 23 2 14.5a14 14 0 0 1 28 0C30 23 23 30 16 38Z" fill="var(--c)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="16" cy="14.5" r="5.2" fill="#fff"/></svg>`;

  function drawAreas() {
    S.areas.forEach(a => {
      if (!a.hasCoords) return;
      const [ax, ay] = project(toNum(a.lat), toNum(a.lng));
      const pin = document.createElement('button');
      pin.type = 'button';
      pin.className = 'area-pin';
      pin.style.setProperty('--c', a.color);
      pin.setAttribute('aria-label', names(a).main);
      pin.innerHTML = `<span class="pin-in">${PIN_SVG}</span><span class="fav-dot" hidden></span>`;
      pin.addEventListener('click', () => selectArea(a.id));
      pinsEl.appendChild(pin);

      const leader = svgEl('line', { class: 'leader' }, leadersSvg);
      const label = document.createElement('button');
      label.type = 'button';
      label.className = 'area-label';
      label.style.setProperty('--c', a.color);
      label.innerHTML = areaLabelHTML(a);
      label.addEventListener('click', () => selectArea(a.id));
      labelsEl.appendChild(label);

      areaEls[a.id] = { pin, label, leader, ax, ay, off: { dx: 0, dy: -50 } };
    });
  }

  /* 선택/찜 상태를 핀에 반영 (선택된 핀은 커지고, 나머지는 흐려지고, 찜 개수가 붙음) */
  function styleAreas() {
    const zoomed = !!S.currentArea;
    mapEl.classList.toggle('zoomed', zoomed);
    Object.entries(areaEls).forEach(([id, a]) => {
      const sel = S.currentArea === id;
      a.pin.classList.toggle('sel', sel);
      a.label.classList.toggle('sel', sel);
      a.leader.classList.toggle('sel', sel);
      a.pin.classList.toggle('dim', zoomed && !sel);
      a.pin.style.zIndex = sel ? 3 : 1;
      const n = S.places.filter(p => p.area_id === id && favs.has(p.id)).length;
      const dot = a.pin.querySelector('.fav-dot');
      dot.hidden = !n;
      dot.innerHTML = `${ic('heart')}${n}`;
    });
  }

  /* 화면에서 너무 가까운 핀끼리는 살짝 밀어내서 겹치지 않게 (핀은 대략적인 위치만 나타내므로) */
  const PIN_GAP = 30;
  function pinPoints(view) {
    const ids = Object.keys(areaEls);
    const p = ids.map(id => toPx(areaEls[id].ax, areaEls[id].ay, view));
    for (let it = 0; it < 40; it++) {
      let moved = false;
      for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) {
        let dx = p[j][0] - p[i][0], dy = p[j][1] - p[i][1], d = Math.hypot(dx, dy);
        if (d >= PIN_GAP) continue;
        if (d < .01) { dx = 1; dy = 0; d = 1; }
        const push = (PIN_GAP - d) / 2, ux = dx / d, uy = dy / d;
        p[i][0] -= ux * push; p[i][1] -= uy * push;
        p[j][0] += ux * push; p[j][1] += uy * push;
        moved = true;
      }
      if (!moved) break;
    }
    const out = {};
    ids.forEach((id, i) => { out[id] = p[i]; });
    return out;
  }

  /* 전체 화면에서 구역 이름표가 핀·다른 이름표와 안 겹치게 자리 잡기 */
  function layoutLabels(view, bottomLimit) {
    const limit = bottomLimit == null ? H - 70 : bottomLimit;
    const ids = Object.keys(areaEls);
    const shown = pinPoints(view), tips = ids.map(id => shown[id]);
    const pinRects = tips.map(([px, py]) => ({ l: px - 20, r: px + 20, t: py - PIN_H - 6, b: py + 2 }));
    const placed = [];
    const hit = (r1, r2) => r1.l < r2.r && r1.r > r2.l && r1.t < r2.b && r1.b > r2.t;
    ids.forEach((id, i) => {
      const a = areaEls[id], [px, py] = tips[i];
      a.label.classList.remove('nofit'); a.leader.classList.remove('nofit');
      if (id === S.currentArea) return;           // 선택된 구역 이름표는 숨김(시트에 나옴)
      const hx = px, hy = py - 24;               // 핀 머리 중심
      const w = a.label.offsetWidth + 8, h = a.label.offsetHeight + 6;
      let chosen = null;
      search:
      for (const dist of [36, 58, 84, 112]) {
        for (const [ux, uy] of [[0, -1], [1, 0], [-1, 0], [0, 1], [.8, -.8], [-.8, -.8], [.8, .8], [-.8, .8]]) {
          const dx = ux * (dist + Math.abs(ux) * w / 2), dy = uy * (dist + Math.abs(uy) * h / 2);
          const r = { l: hx + dx - w / 2, r: hx + dx + w / 2, t: hy + dy - h / 2, b: hy + dy + h / 2 };
          if (r.l < 6 || r.r > W - 6 || r.t < 6 || r.b > limit) continue;   // 아래 안내 문구·시트 자리 비우기
          if (placed.some(q => hit(r, q)) || pinRects.some(q => hit(r, q))) continue;
          chosen = { dx, dy, r };
          break search;
        }
      }
      if (!chosen && bottomLimit != null && S.currentArea) {   // 구역 안에서 자리가 없으면 겹치지 않게 숨김
        a.label.classList.add('nofit'); a.leader.classList.add('nofit');
        return;
      }
      if (!chosen) chosen = { dx: 0, dy: -36 - h / 2, r: { l: hx - w / 2, r: hx + w / 2, t: hy - 36 - h, b: hy - 36 } };
      a.off = { dx: chosen.dx, dy: chosen.dy - 24 };   // 핀 끝(px,py) 기준
      placed.push(chosen.r);
    });
  }

  function renderAreaLabels() {
    S.areas.forEach(a => { if (areaEls[a.id]) areaEls[a.id].label.innerHTML = areaLabelHTML(a); });
    layoutLabels(overviewView());
    applyView();
  }

  /* 지금 시점(V)을 화면에 반영 — 확대 애니메이션 중엔 매 프레임 호출됨 */
  function applyView() {
    if (!SHAPE || !W) return;
    mapSvg.setAttribute('viewBox', `${V.x} ${V.y} ${V.w} ${V.h}`);
    const s = V.w / W;                          // 화면 1px 당 SVG 단위
    shadowG.setAttribute('transform', `translate(0 ${(5 * s).toFixed(3)})`);
    districtTexts.forEach(([tx]) => tx.setAttribute('font-size', (11.5 * s).toFixed(3)));
    const shown = pinPoints(V);
    Object.entries(areaEls).forEach(([id, a]) => {
      const [px, py] = shown[id];
      const off = a.off;
      a.pin.style.transform = `translate(${(px - PIN_W / 2).toFixed(1)}px, ${(py - PIN_TIP_Y).toFixed(1)}px)`;
      a.label.style.transform = `translate(${(px + off.dx).toFixed(1)}px, ${(py + off.dy).toFixed(1)}px) translate(-50%, -50%)`;
      a.leader.setAttribute('x1', px.toFixed(1)); a.leader.setAttribute('y1', (py - 24).toFixed(1));
      a.leader.setAttribute('x2', (px + off.dx).toFixed(1)); a.leader.setAttribute('y2', (py + off.dy).toFixed(1));
    });
  }

  /* 화면에 맞는 시점 계산: bounds=[x0,y0,x1,y1], bottom/left/top = 가려지거나 비워둘 부분(px) */
  function viewFor(bounds, o) {
    const pad = o.pad == null ? 16 : o.pad, bottom = o.bottom || 0, left = o.left || 0, top = o.top || 0;
    const [x0, y0, x1, y1] = bounds;
    const availW = Math.max(80, W - left - 2 * pad), availH = Math.max(80, H - bottom - top - 2 * pad);
    const sc = Math.max((x1 - x0) / availW, (y1 - y0) / availH);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return { x: cx - (left + (W - left) / 2) * sc, y: cy - (top + (H - bottom - top) / 2) * sc, w: W * sc, h: H * sc };
  }

  function goTo(v, animate) {
    cancelAnimationFrame(animId);
    if (!animate || reduceMotion || !W) { Object.assign(V, v); relayout(); return; }
    const from = { ...V }, t0 = performance.now(), dur = 650;
    const c0x = from.x + from.w / 2, c0y = from.y + from.h / 2, c1x = v.x + v.w / 2, c1y = v.y + v.h / 2;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      V.w = from.w * Math.pow(v.w / from.w, e);   // 확대 배율은 로그 보간 → 자연스러운 줌
      V.h = V.w * H / W;
      V.x = c0x + (c1x - c0x) * e - V.w / 2;
      V.y = c0y + (c1y - c0y) * e - V.h / 2;
      if (k < 1) { applyView(); animId = requestAnimationFrame(step); }
      else { Object.assign(V, v); relayout(); }
    };
    animId = requestAnimationFrame(step);
  }

  /** 지금 보이는 화면 기준으로 이름표 자리 다시 잡기 (움직임이 끝날 때마다) */
  function relayout() {
    if (!SHAPE) return;
    layoutLabels(V, S.currentArea ? H - sheetCover() - 8 : H - 70);
    applyView();
  }

  /* ---------- 손가락으로 지도 움직이기 / 확대·축소 ---------- */
  let userMoved = false;                        // 사용자가 지도를 직접 움직였으면 자동으로 다시 맞추지 않음
  function clampCenter() {
    const [x0, y0, x1, y1] = SHAPE.bounds;
    const cx = Math.max(x0, Math.min(x1, V.x + V.w / 2)), cy = Math.max(y0, Math.min(y1, V.y + V.h / 2));
    V.x = cx - V.w / 2; V.y = cy - V.h / 2;
  }
  function zoomAt(f, px, py) {                  // f<1 확대, f>1 축소, (px,py)=손가락 위치
    const maxW = overviewView().w * 1.6, minW = metersToUnits(1200);
    const nw = Math.max(minW, Math.min(maxW, V.w * f));
    const ux = V.x + px / W * V.w, uy = V.y + py / H * V.h;
    V.w = nw; V.h = nw * H / W;
    V.x = ux - px / W * V.w; V.y = uy - py / H * V.h;
  }
  (function mapGestures() {
    const ptrs = new Map();
    let g = null, suppressClick = false, wheelTimer = 0;
    const local = (x, y) => { const r = mapEl.getBoundingClientRect(); return [x - r.left, y - r.top]; };
    mapEl.addEventListener('pointerdown', e => {
      if (!SHAPE || (e.pointerType === 'mouse' && e.button !== 0)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      cancelAnimationFrame(animId);
      if (!g) g = { moved: false, x0: e.clientX, y0: e.clientY, pinch: null };
      if (ptrs.size === 2) g.pinch = null;
    });
    window.addEventListener('pointermove', e => {
      if (!g || !ptrs.has(e.pointerId)) return;
      const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
      ptrs.set(e.pointerId, cur);
      if (!g.moved && ptrs.size < 2 && Math.hypot(cur.x - g.x0, cur.y - g.y0) < 6) return;
      g.moved = true; userMoved = true;
      if (ptrs.size === 1) {
        const sc = V.w / W;
        V.x -= (cur.x - prev.x) * sc; V.y -= (cur.y - prev.y) * sc;
      } else {
        const [a, b] = [...ptrs.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        if (g.pinch && d > 0) {
          const [lx, ly] = local(mx, my);
          zoomAt(g.pinch.d / d, lx, ly);
          const sc = V.w / W;
          V.x -= (mx - g.pinch.mx) * sc; V.y -= (my - g.pinch.my) * sc;
        }
        g.pinch = { d, mx, my };
      }
      clampCenter();
      applyView();
    });
    const up = e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.delete(e.pointerId);
      if (ptrs.size === 0) {
        if (g && g.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); relayout(); }
        g = null;
      } else if (g) g.pinch = null;
    };
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    // 끌다가 손을 뗀 건 핀 탭으로 치지 않음
    mapEl.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
    mapEl.addEventListener('wheel', e => {
      if (!SHAPE) return;
      e.preventDefault();
      cancelAnimationFrame(animId);
      const [lx, ly] = local(e.clientX, e.clientY);
      zoomAt(Math.exp(e.deltaY * 0.0015), lx, ly);
      userMoved = true;
      clampCenter();
      applyView();
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(relayout, 150);
    }, { passive: false });
  })();

  function overviewBounds() {
    let [x0, y0, x1, y1] = SHAPE.bounds;
    const m = metersToUnits(300);
    Object.values(areaEls).forEach(a => {
      x0 = Math.min(x0, a.ax - m); y0 = Math.min(y0, a.ay - m);
      x1 = Math.max(x1, a.ax + m); y1 = Math.max(y1, a.ay + m);
    });
    return [x0, y0, x1, y1];
  }
  const overviewView = () => viewFor(overviewBounds(), { pad: 18, bottom: 56, top: 44 });   // 위쪽은 핀 높이만큼 비움   // 아래 안내 문구만큼 위로

  function fitOverview(animate) {
    const v = overviewView();
    layoutLabels(v);
    goTo(v, animate);
  }

  /* 구역을 고르면 크게 확대하지 않고, 모든 핀이 다 보이는 범위를 시트 위 공간에 맞춤 (지도는 고정) */
  function fitArea(animate = true) {
    const left = isWide() ? $('#sheet').offsetWidth + 32 : 0;
    const m = metersToUnits(1500);
    let b = null;
    Object.values(areaEls).forEach(a => {
      b = b ? [Math.min(b[0], a.ax - m), Math.min(b[1], a.ay - m), Math.max(b[2], a.ax + m), Math.max(b[3], a.ay + m)]
            : [a.ax - m, a.ay - m, a.ax + m, a.ay + m];
    });
    goTo(viewFor(b || overviewBounds(), { pad: 14, bottom: sheetCover(), left, top: 44 }), animate);
  }

  function onResize() {
    if (!SHAPE) return;
    measure();
    if (userMoved) {                            // 사용자가 움직인 시점은 유지하고 화면 비율만 맞춤
      const cx = V.x + V.w / 2, cy = V.y + V.h / 2;
      V.h = V.w * H / W; V.x = cx - V.w / 2; V.y = cy - V.h / 2;
      if (S.currentArea) setSnap(snap, false);
      relayout();
      return;
    }
    if (S.currentArea) { layoutLabels(overviewView()); setSnap(snap, false); fitArea(false); } else fitOverview(false);
  }

  /* =========================================================
   * 구역 칩 / 바텀시트
   * ========================================================= */
  function renderAreaChips() {
    const wrap = $('#areaChips');
    const chips = [`<button class="chip ${S.currentArea ? '' : 'on'}" type="button" data-area="">${ic('map', 'ic-s')}${esc(t('all'))}</button>`];
    S.areas.forEach(a => {
      chips.push(`<button class="chip ${S.currentArea === a.id ? 'on' : ''}" type="button" data-area="${esc(a.id)}" style="--c:${esc(a.color)}">
        <span class="dot"></span>${esc(names(a).main)}</button>`);
    });
    wrap.innerHTML = chips.join('');
    const on = wrap.querySelector('.chip.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  $('#areaChips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    if (b.dataset.area) selectArea(b.dataset.area);
    else if (S.currentArea) closeTop();
    else { userMoved = false; fitOverview(true); }     // 전체 화면에서 누르면 처음 위치로
  });

  function cardHTML(p, opts) {
    const n = names(p), ck = catKey(p);
    const photo = (p.photos || []).find(Boolean);
    const showDesc = !(opts && opts.noDesc) && txt(p, 'desc');
    const on = favs.has(p.id);
    return `<div class="card" role="button" tabindex="0" data-place="${esc(p.id)}">
      <div class="thumb">${photo ? imgTag(photo, ck, n.main) : placeholder(ck)}</div>
      <div class="card-body">
        <div class="card-name">${esc(n.main)}</div>
        ${n.sub ? `<div class="card-sub">${esc(n.sub)}</div>` : ''}
        ${showDesc ? `<div class="card-desc">${esc(txt(p, 'desc'))}</div>` : ''}
        <div class="meta">${ic(CATS[ck])}<span>${esc(catLabel(ck))}</span></div>
      </div>
      <button class="heart-btn ${on ? 'on' : ''}" type="button" data-fav="${esc(p.id)}" aria-pressed="${on}" aria-label="${esc(t('fav_off'))}">${ic('heart')}</button>
    </div>`;
  }

  function visiblePlaces() {
    if (!S.currentArea) return [];
    return S.places.filter(p => p.area_id === S.currentArea && (S.filter === 'all' || catKey(p) === S.filter));
  }

  function renderSheet() {
    const a = S.areaById[S.currentArea];
    if (!a) return;
    const n = names(a);
    $('#sheetTitle').style.setProperty('--c', a.color);
    $('#sheetName').textContent = n.main;
    $('#sheetSub').textContent = n.sub;
    $('#sheetDesc').textContent = txt(a, 'desc');
    $('#sheetDesc').hidden = !txt(a, 'desc');

    const inArea = S.places.filter(p => p.area_id === a.id);
    // 장소가 있는 카테고리만 보여줌 (선택지를 줄여서 고르기 쉽게)
    $('#filters').innerHTML = CAT_KEYS.map(k => {
      const cnt = k === 'all' ? inArea.length : inArea.filter(p => catKey(p) === k).length;
      if (k !== 'all' && !cnt) return '';
      return `<button class="chip ${S.filter === k ? 'on' : ''}" type="button" data-filter="${k}">
        ${ic(k === 'all' ? 'grid' : CATS[k], 'ic-s')}${esc(catLabel(k))}<span class="n">${cnt}</span></button>`;
    }).join('');

    const list = visiblePlaces();
    $('#sheetList').innerHTML = list.length
      ? list.map(p => cardHTML(p)).join('')
      : `<div class="empty">${esc(t('empty_cat'))}</div>`;
  }

  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    S.filter = b.dataset.filter;
    renderSheet();
    if (snap === 'peek') setSnap('half');
  });

  function bindCardList(el) {
    el.addEventListener('click', e => {
      const fav = e.target.closest('[data-fav]');
      if (fav) { e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
      const card = e.target.closest('[data-place]');
      if (card) openDetail(card.dataset.place);
    });
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const card = e.target.closest('[data-place]');
      if (card && e.target === card) openDetail(card.dataset.place);
    });
  }
  bindCardList($('#sheetList'));

  function selectArea(id) {
    if (!S.areaById[id]) return;
    if (S.currentArea === id) { setSnap('half'); return; }
    const fromOverview = !S.currentArea;
    userMoved = false;
    S.currentArea = id;
    S.filter = 'all';
    sheetEl.classList.add('open');
    sheetEl.setAttribute('aria-hidden', 'false');
    $('#hint').hidden = true;
    renderAreaChips();
    renderSheet();
    styleAreas();
    requestAnimationFrame(() => setSnap('half'));
    if (fromOverview) pushLayer('area', showOverview);
  }

  function showOverview() {
    userMoved = false;
    S.currentArea = null;
    S.filter = 'all';
    sheetEl.classList.remove('open');
    sheetEl.setAttribute('aria-hidden', 'true');
    hideSheet();
    $('#hint').hidden = false;
    renderAreaChips();
    styleAreas();
    fitOverview(true);
  }

  $('#backBtn').addEventListener('click', () => { if (S.currentArea) closeTop(); });

  /* =========================================================
   * 바텀시트 3단계 (접힘 / 반 / 전체) — 끌어서 놓으면 가까운 단계로 붙음
   * ========================================================= */
  const sheetEl = $('#sheet'), listEl = $('#sheetList'), wrapEl = $('.map-wrap');
  let snap = 'half', sheetY = 0;
  const isWide = () => window.innerWidth >= 720;

  function snapY(name) {                        // 시트 위쪽이 지도 영역 위에서 얼마나 내려와 있는지(px)
    const h = wrapEl.clientHeight;
    const peek = Math.min(h, listEl.offsetTop + 8);          // 손잡이 + 제목 + 필터까지만 보이게
    const vis = name === 'full' ? h : name === 'half' ? Math.min(h, Math.max(peek + 130, Math.round(h * 0.48))) : peek;
    return Math.max(0, h - vis);
  }
  function setSheetY(y, animate) {
    sheetY = y;
    sheetEl.style.transition = animate ? '' : 'none';
    sheetEl.style.transform = `translateY(${y}px)`;
  }
  function setSnap(name, animate = true) {
    snap = name;
    sheetEl.classList.toggle('full', name === 'full' && !isWide());
    $('#app').classList.toggle('sheet-full', name === 'full' && !isWide());
    if (isWide()) { sheetEl.style.transition = animate ? '' : 'none'; sheetEl.style.transform = 'none'; return; }
    if (name !== 'full') listEl.scrollTop = 0;
    setSheetY(snapY(name), animate);
    if (S.currentArea && name !== 'full' && !userMoved) requestAnimationFrame(() => fitArea(animate));
  }
  function hideSheet() {
    sheetEl.classList.remove('full');
    $('#app').classList.remove('sheet-full');
    sheetEl.style.transition = '';
    sheetEl.style.transform = 'translateY(105%)';
  }
  /** 지도에서 시트가 가리는 높이 (지도를 맞출 때 사용) */
  function sheetCover() {
    if (isWide()) return 0;
    return wrapEl.clientHeight - snapY(snap === 'full' ? 'half' : snap);
  }

  $('#sheetHandle').addEventListener('click', () => setSnap(snap === 'full' ? 'half' : 'full'));

  (function sheetDrag() {
    let st = null;
    sheetEl.addEventListener('touchstart', e => {
      if (isWide() || !S.currentArea) return;
      const tp = e.touches[0];
      st = { x0: tp.clientX, y0: tp.clientY, y: sheetY, startY: sheetY, mode: null,
             inList: !!e.target.closest('.sheet-list'), lastY: tp.clientY, lastT: performance.now(), v: 0 };
    }, { passive: true });

    sheetEl.addEventListener('touchmove', e => {
      if (!st) return;
      const tp = e.touches[0], dx = tp.clientX - st.x0, dy = tp.clientY - st.y0;
      if (!st.mode) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dx) > Math.abs(dy)) { st = null; return; }                     // 가로 스크롤(필터 칩)
        if (snap === 'full' && st.inList && (listEl.scrollTop > 0 || dy < 0)) { st = null; return; }  // 목록 스크롤
        st.mode = 'drag';
        sheetEl.style.transition = 'none';
      }
      e.preventDefault();
      const y = Math.max(0, Math.min(snapY('peek') + 40, st.startY + dy));
      setSheetY(y, false);
      st.y = y;
      const now = performance.now();
      st.v = (tp.clientY - st.lastY) / Math.max(1, now - st.lastT);              // px/ms, +면 아래로
      st.lastY = tp.clientY; st.lastT = now;
    }, { passive: false });

    const end = () => {
      if (!st || st.mode !== 'drag') { st = null; return; }
      const y = st.y, half = snapY('half');
      let target;
      if (st.v > 0.4) target = y < half ? 'half' : 'peek';
      else if (st.v < -0.4) target = y > half ? 'half' : 'full';
      else target = ['full', 'half', 'peek'].reduce((b, n) => Math.abs(snapY(n) - y) < Math.abs(snapY(b) - y) ? n : b, 'half');
      st = null;
      setSnap(target);
    };
    sheetEl.addEventListener('touchend', end);
    sheetEl.addEventListener('touchcancel', end);
  })();

  /* =========================================================
   * 장소 상세
   * ========================================================= */
  function menuHTML(menu, ck) {
    // section_ja / section_ko 가 같은 항목끼리 묶기 (json 순서 유지)
    const groups = [];
    menu.forEach(m => {
      const sec = txt(m, 'section');
      if (!groups.length || groups[groups.length - 1].sec !== sec) groups.push({ sec, items: [] });
      groups[groups.length - 1].items.push(m);
    });
    return groups.map(g => {
      const withPhoto = g.items.filter(m => m.photo), noPhoto = g.items.filter(m => !m.photo);
      const tiles = withPhoto.map(m => {
        const mn = names(m);
        return `<div class="menu-item">
          <button class="menu-photo" type="button" data-zoom="${esc(m.photo)}" aria-label="${esc(mn.main)}">
            ${imgTag(m.photo, ck, mn.main)}
            ${m.signature ? `<span class="badge">${esc(t('signature'))}</span>` : ''}
          </button>
          <div class="menu-info">
            <div class="menu-name">${esc(mn.main)}</div>
            ${mn.sub ? `<div class="menu-sub">${esc(mn.sub)}</div>` : ''}
            ${txt(m, 'desc') ? `<div class="menu-desc">${esc(txt(m, 'desc'))}</div>` : ''}
            ${formatPrice(m.price) ? `<div class="price">${esc(formatPrice(m.price))}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      const rows = noPhoto.map(m => {
        const mn = names(m);
        return `<div class="menu-row">
          <div class="menu-text">
            <div class="menu-name">${esc(mn.main)}</div>
            ${mn.sub ? `<div class="menu-sub">${esc(mn.sub)}</div>` : ''}
            ${txt(m, 'desc') ? `<div class="menu-desc">${esc(txt(m, 'desc'))}</div>` : ''}
          </div>
          ${formatPrice(m.price) ? `<div class="price">${esc(formatPrice(m.price))}</div>` : ''}
        </div>`;
      }).join('');
      return `${g.sec ? `<div class="menu-sec">${esc(g.sec)}</div>` : ''}
        ${tiles ? `<div class="menu-grid">${tiles}</div>` : ''}
        ${rows ? `<div class="menu-list">${rows}</div>` : ''}`;
    }).join('');
  }

  function renderDetail() {
    const p = S.placeById[S.detailId];
    if (!p) return;
    const n = names(p), ck = catKey(p);
    const area = S.areaById[p.area_id];
    const photos = (p.photos || []).filter(Boolean);
    const menu = (p.menu || []).filter(m => m && (m.name_ko || m.name_ja));
    const hours = txt(p, 'hours');

    $('#detailTitle').textContent = n.main;

    const gallery = `<div class="gallery">
      <div class="slider" id="slider">${photos.length
        ? photos.map((src, i) => imgTag(src, ck, `${n.main} ${i + 1}`)).join('')
        : placeholder(ck)}</div>
      ${photos.length > 1 ? `<div class="dots" id="dots">${photos.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
    </div>`;

    const pills = [];
    if (area) pills.push(`<span class="pill" style="--c:${esc(area.color)}"><span class="dot"></span>${esc(names(area).main)}</span>`);
    pills.push(`<span class="pill">${ic(CATS[ck])}${esc(catLabel(ck))}</span>`);

    const infoRows = [];
    if (p.address_ko) infoRows.push(`<div class="info-row">${ic('pin')}<div>${esc(p.address_ko)}</div></div>`);
    if (hours) infoRows.push(`<div class="info-row">${ic('clock')}<div>${esc(hours)}</div></div>`);

    $('#detailBody').innerHTML = `${gallery}
      <div class="detail">
        <div class="pills">${pills.join('')}</div>
        <h2>${esc(n.main)}</h2>
        ${n.sub ? `<div class="sub">${esc(n.sub)}</div>` : ''}
        ${txt(p, 'desc') ? `<p class="lead">${esc(txt(p, 'desc'))}</p>` : ''}
        ${infoRows.length ? `<div class="info">${infoRows.join('')}</div>` : ''}
        ${menu.length ? `<div class="section-h"><h3>${esc(t('menu'))}</h3><span>${esc(t('menu_note'))}</span></div>${menuHTML(menu, ck)}` : ''}
      </div>`;

    const slider = $('#slider'), dots = $('#dots');
    if (slider && dots) {
      slider.addEventListener('scroll', () => {
        const i = Math.round(slider.scrollLeft / slider.clientWidth);
        dots.querySelectorAll('i').forEach((d, j) => d.classList.toggle('on', j === i));
      }, { passive: true });
    }

    const query = (p.naver_query || p.name_ko || p.name_ja || '').trim();
    const naverUrl = /^https?:\/\//.test(p.naver_url || '')
      ? p.naver_url
      : `https://map.naver.com/p/search/${encodeURIComponent(query)}`;
    const googleUrl = validCoords(p.lat, p.lng)
      ? `https://www.google.com/maps/search/?api=1&query=${toNum(p.lat)},${toNum(p.lng)}`
      : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((p.address_ko || query).trim())}`;
    const on = favs.has(p.id);
    $('#detailActions').innerHTML = `
      <button class="btn btn-fav ${on ? 'on' : ''}" type="button" data-fav="${esc(p.id)}" aria-pressed="${on}">${ic('heart')}<span>${esc(on ? t('fav_on') : t('fav_off'))}</span></button>
      <a class="btn btn-naver" href="${esc(naverUrl)}" target="_blank" rel="noopener">${esc(t('naver'))}</a>
      <a class="btn btn-outline" href="${esc(googleUrl)}" target="_blank" rel="noopener">${esc(t('google'))}${ic('out')}</a>`;
  }

  function openDetail(id) {
    if (!S.placeById[id]) return;
    S.detailId = id;
    renderDetail();
    const m = $('#detail');
    m.hidden = false;
    $('#detailBody').scrollTop = 0;
    pushLayer('detail', () => { m.hidden = true; S.detailId = null; });
  }

  $('#detailBody').addEventListener('click', e => {
    const z = e.target.closest('[data-zoom]');
    if (z) openLightbox(z.dataset.zoom);
  });
  $('#detailActions').addEventListener('click', e => {
    const f = e.target.closest('[data-fav]');
    if (f) toggleFav(f.dataset.fav);
  });

  function openLightbox(src) {
    $('#lightboxImg').src = src;
    $('#lightbox').hidden = false;
    pushLayer('lightbox', () => { $('#lightbox').hidden = true; $('#lightboxImg').removeAttribute('src'); });
  }
  $('#lightbox').addEventListener('click', () => closeTop());

  /* =========================================================
   * 찜하기
   * ========================================================= */
  const favPlaces = () => S.places.filter(p => favs.has(p.id));

  function toggleFav(id) {
    if (!S.placeById[id]) return;
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    store.set('daegu-map:favs', [...favs]);
    const badge = $('#favBadge');
    badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump');
    refreshFavUI();
  }

  function refreshFavUI() {
    $('#favCount').textContent = favPlaces().length;
    if (S.currentArea) renderSheet();
    styleAreas();
    if (S.detailId) {
      const btn = $('#detailActions [data-fav]');
      if (btn) {
        const on = favs.has(S.detailId);
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on);
        btn.querySelector('span').textContent = on ? t('fav_on') : t('fav_off');
      }
    }
    if (!$('#favs').hidden) renderFavs();
  }

  /** 찜한 장소를 구역별로 묶기 (areas.json 순서, 모르는 구역은 맨 뒤) */
  function groupedFavs() {
    const list = favPlaces();
    const groups = S.areas.map(a => ({ area: a, items: list.filter(p => p.area_id === a.id) })).filter(g => g.items.length);
    const orphans = list.filter(p => !S.areaById[p.area_id]);
    if (orphans.length) groups.push({ area: null, items: orphans });
    return groups;
  }

  function favText() {
    const lines = ['【行きたい場所 / 가고 싶은 곳】'];
    groupedFavs().forEach((g, i) => {
      if (i > 0) lines.push('');
      lines.push(`■ ${g.area ? (g.area.name_ja || g.area.name_ko) : STR.ja.other}`);
      g.items.forEach(p => {
        const ja = (p.name_ja || '').trim(), ko = (p.name_ko || '').trim();
        lines.push(ja && ko && ja !== ko ? `・${ja} (${ko})` : `・${ja || ko}`);
      });
    });
    return lines.join('\n');
  }

  function renderFavs() {
    const groups = groupedFavs();
    $('#copyBtn').disabled = !groups.length;
    if (!groups.length) {
      $('#favList').innerHTML = `<div class="empty">${esc(t('fav_empty'))}</div>`;
      return;
    }
    const text = favText();
    $('#favList').innerHTML = `<p class="favs-lead">${esc(t('fav_lead'))}</p>` + groups.map(g => `
      <div class="fav-group">
        <h3 style="--c:${esc(g.area ? g.area.color : '#948B80')}"><span class="dot"></span>${esc(g.area ? names(g.area).main : t('other'))}</h3>
        ${g.items.map(p => cardHTML(p, { noDesc: true })).join('')}
      </div>`).join('') + `
      <div class="preview-label">${esc(t('preview'))}</div>
      <textarea class="preview" id="preview" readonly rows="${text.split('\n').length}">${esc(text)}</textarea>`;
  }
  bindCardList($('#favList'));

  function openFavs() {
    renderFavs();
    const m = $('#favs');
    m.hidden = false;
    pushLayer('favs', () => { m.hidden = true; });
  }
  $('#favBadge').addEventListener('click', openFavs);

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* 아래 방식으로 재시도 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  $('#copyBtn').addEventListener('click', async () => {
    const ok = await copyText(favText());
    if (ok) { toast(t('copied')); return; }
    const pv = $('#preview');
    if (pv) { pv.focus(); pv.select(); }
    toast(t('copy_fail'));
  });

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  /* =========================================================
   * 언어 전환
   * ========================================================= */
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  }

  function setLang(l) {
    if (!STR[l] || l === lang) return;
    lang = l;
    store.set('daegu-map:lang', lang);
    applyLang();
    renderAreaChips();
    if (SHAPE) { renderDistrictNames(); renderAreaLabels(); styleAreas(); }
    if (S.currentArea) renderSheet();
    if (S.detailId) renderDetail();
    if (!$('#favs').hidden) renderFavs();
  }

  /* =========================================================
   * 데이터 불러오기 + 검증
   * ========================================================= */
  async function loadText(url, bust) {
    const res = await fetch(bust ? `${url}?t=${Date.now()}` : url, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
    return res.text();
  }

  /* =========================================================
   * 업데이트 알림: 보는 도중에 json이 바뀌면 "새로고침" 안내
   * ========================================================= */
  let baseline = '', dismissedSig = '', updateTimer = 0;
  async function checkUpdate() {
    if (document.hidden || !baseline) return;
    try {
      const [a, p] = await Promise.all([loadText('areas.json', true), loadText('places.json', true)]);
      const sig = a + '\n' + p;
      if (sig === baseline || sig === dismissedSig) return;
      let added = 0;
      try { added = JSON.parse(p).filter(x => x && x.id && !S.placeById[x.id]).length; } catch (e) { return; }  // 저장 중인 깨진 json은 무시
      try { JSON.parse(a); } catch (e) { return; }
      $('#updateMsg').textContent = added ? t('update_new')(added) : t('update_changed');
      $('#updateBar').dataset.sig = sig;
      $('#updateBar').classList.add('show');
    } catch (e) { /* 오프라인 등은 조용히 넘김 */ }
  }
  function startUpdateWatch() {
    clearInterval(updateTimer);
    updateTimer = setInterval(checkUpdate, 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
    window.addEventListener('focus', checkUpdate);
    $('#updateGo').addEventListener('click', () => location.reload());
    $('#updateClose').addEventListener('click', () => {
      dismissedSig = $('#updateBar').dataset.sig || '';
      $('#updateBar').classList.remove('show');
    });
  }

  function prepare(areas, places) {
    if (!Array.isArray(areas)) { console.warn('[areas.json] 배열이 아닙니다'); areas = []; }
    if (!Array.isArray(places)) { console.warn('[places.json] 배열이 아닙니다'); places = []; }

    areas.forEach((a, i) => {
      if (!a || !a.id) { console.warn(`[areas.json] ${i}번째 구역에 id가 없어 건너뜁니다`, a); return; }
      if (S.areaById[a.id]) { console.warn(`[areas.json] id 중복: ${a.id} (뒤의 것은 건너뜁니다)`); return; }
      a.color = a.color || AREA_COLORS[S.areas.length % AREA_COLORS.length];
      a.hasCoords = validCoords(a.lat, a.lng);
      if (!a.hasCoords) console.warn(`[areas.json] 좌표 없음/잘못됨 → 지도에 핀을 찍지 않습니다: ${a.id}`, { lat: a.lat, lng: a.lng });
      S.areas.push(a);
      S.areaById[a.id] = a;
    });

    places.forEach((p, i) => {
      if (!p || !p.id) { console.warn(`[places.json] ${i}번째 장소에 id가 없어 건너뜁니다`, p); return; }
      if (S.placeById[p.id]) { console.warn(`[places.json] id 중복: ${p.id} (뒤의 것은 건너뜁니다)`); return; }
      if (!CATS[p.category]) console.warn(`[places.json] 알 수 없는 category "${p.category}" (${p.id}) → restaurant / cafe / activity / shop 중 하나로 써 주세요`);
      if (!S.areaById[p.area_id]) console.warn(`[places.json] area_id "${p.area_id}"가 areas.json에 없습니다 (${p.id}) → 구역 목록에 안 나옵니다`);
      S.places.push(p);
      S.placeById[p.id] = p;
    });
  }

  async function init() {
    fillIcons();
    applyLang();
    // 정적 버튼 이벤트 (아이콘을 채운 뒤에 연결)
    document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); closeTop(); }));
    $('#noticeClose').addEventListener('click', () => { $('#notice').hidden = true; requestAnimationFrame(onResize); });

    try { history.replaceState(null, ''); } catch (e) {}
    try {
      const [aText, pText, sText] = await Promise.all([loadText('areas.json', true), loadText('places.json', true), loadText('daegu-shape.json')]);
      baseline = aText + '\n' + pText;
      SHAPE = JSON.parse(sText);
      prepare(JSON.parse(aText), JSON.parse(pText));
    } catch (err) {
      console.error(err);
      const box = document.createElement('div');
      box.className = 'load-error';
      box.innerHTML = `<div><b>${esc(t('load_err'))}</b><br>${esc(String(err.message || err))}<br><br>
        ${location.protocol === 'file:'
          ? 'index.html을 더블클릭으로 열면 json을 못 읽어요.<br>폴더에서 <code>python3 -m http.server</code> 실행 후<br><code>http://localhost:8000</code> 으로 열어 주세요.'
          : 'areas.json / places.json / daegu-shape.json 문법(쉼표, 따옴표)을 확인해 주세요.'}</div>`;
      $('.map-wrap').appendChild(box);
      return;
    }
    measure();
    buildMap();
    drawAreas();
    renderAreaChips();
    $('#favCount').textContent = favPlaces().length;
    styleAreas();
    fitOverview(false);
    startUpdateWatch();
    if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(onResize)).observe(mapEl);
    else window.addEventListener('resize', onResize);
  }

  init();
})();
</script>
</body>
</html>
